<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self';" />
  <title>Gmail Manager</title>
  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body>

        <div>
          <div class="name">Gmail Manager</div>
          <div class="ver">v0.1.0</div>
        </div>
      </div>

    <main class="main" id="main"></main>

  <script src="icons.js"></script>
