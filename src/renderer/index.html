<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <!-- appbg: - своя схема для пользовательской картинки фона (см. main/appearance.js).
       data: нужен превью-градиентам в панели оформления.
       https: - фото товара из парсера (imageUrl лида). Без него браузер молча
       блокировал картинку объявления в чатах и в превью HTML-письма. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; img-src 'self' data: https: appbg:;" />
  <title>Gmail Manager</title>
  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/glass.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body>
  <!-- Фон и вуаль отдельными слоями под всем приложением. -->
  <div class="bg-layer gradient" id="bgLayer"></div>
  <div class="bg-veil"></div>
  <!-- Подложка рабочей области: ниже карточек, но выше фона. Без неё пустое
       место между карточками отдаёт картинкой в упор. -->
  <div class="content-scrim"></div>

  <!--
    Карта смещения для жидкого стекла.

    R задаёт сдвиг по X, G - по Y. В середине оба канала равны 128, то есть
    смещения нет; к краям каналы уходят в 0 и 255, и подложка растягивается
    наружу - это и читается как преломление на кромке. Плоские участки
    0.32..0.68 держат центр карточки честным, иначе "линза" размазала бы весь
    текст под стеклом.

    preserveAspectRatio="none" растягивает карту на любой размер элемента,
    поэтому фильтр один на все .glass-refract.
  -->
  <svg class="lg-defs" aria-hidden="true" focusable="false">
    <filter id="lg-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feImage preserveAspectRatio="none" result="map"
        href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='240' height='240'%3E%3Cdefs%3E%3ClinearGradient id='x' x1='0' y1='0' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%23000000'/%3E%3Cstop offset='0.32' stop-color='%23800000'/%3E%3Cstop offset='0.68' stop-color='%23800000'/%3E%3Cstop offset='1' stop-color='%23ff0000'/%3E%3C/linearGradient%3E%3ClinearGradient id='y' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23000000'/%3E%3Cstop offset='0.32' stop-color='%23008000'/%3E%3Cstop offset='0.68' stop-color='%23008000'/%3E%3Cstop offset='1' stop-color='%2300ff00'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='240' height='240' fill='url(%23x)'/%3E%3Crect width='240' height='240' fill='url(%23y)' style='mix-blend-mode:screen'/%3E%3C/svg%3E" />
      <feDisplacementMap in="SourceGraphic" in2="map" scale="26"
        xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--accent)" />
      <stop offset="1" stop-color="var(--accent-2)" />
    </linearGradient>
  </svg>

  <div id="app">
    <!-- Рельс разделов. Узкий, только иконки - названия всплывают подсказкой. -->
    <aside class="rail glass">
      <div class="rail-logo" id="railLogo">GM</div>
      <nav class="rail-nav" id="nav"></nav>
      <div class="rail-foot">
        <button class="rail-btn" id="appearanceBtn"></button>
        <button class="rail-btn" id="themeBtn"></button>
      </div>
    </aside>

    <!-- Рабочая панель. Плавает на фоне, как окно на обоях. -->
    <main class="shell glass glass-refract">
      <header class="shell-head">
        <div class="shell-title">
          <div class="view-title" id="pageTitle"></div>
          <div class="view-sub" id="pageSub"></div>
        </div>
        <div class="head-actions">
          <button class="round wide" id="btnPalette"></button>
          <button class="round" id="btnPeek"></button>
          <span class="clock" id="clock"></span>
          <div class="bell-wrap">
            <button class="round" id="btnBell"></button>
            <span class="bell-dot" id="bellDot"></span>
            <div class="notes glass" id="notes"></div>
          </div>
          <button class="btn quick" id="quickRun"></button>
          <span id="sysPill"></span>
          <span class="head-sep"></span>
          <div class="win-controls">
            <button class="win-btn" id="winMin"></button>
            <button class="win-btn" id="winMax"></button>
            <button class="win-btn close" id="winClose"></button>
          </div>
        </div>
      </header>
      <div class="shell-body" id="main"></div>
    </main>
  </div>

  <div class="drawer-scrim" id="drawerScrim"></div>
  <aside class="drawer glass glass-refract" id="drawer"></aside>

  <!-- Командная палитра: Ctrl+K -->
  <div class="palette-scrim" id="paletteScrim">
    <div class="palette glass glass-refract" id="palette"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="icons.js"></script>
  <script src="flags.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
